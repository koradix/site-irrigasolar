  <!-- Folha / broto branco, centralizada no oval -->
  <g transform="translate(46, 34)">
    <path d="M18 52 C18 47, 12 36, 12 26 C12 15, 18 6, 32 1 C32 1, 28 12, 27 20 C25 30, 23 42, 18 52Z" fill="white" opacity="0.9"/>
    <path d="M22 44 C25 37, 30 31, 40 26 C40 26, 35 35, 30 42 C27 46, 24 47, 22 44Z" fill="white" opacity="0.65"/>
